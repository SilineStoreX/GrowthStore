[workspace]
# Try
# require version 2 to avoid "feature" additiveness for dev-dependencies
# https://doc.rust-lang.org/cargo/reference/resolver.html#feature-resolver-version-2
resolver = "2"

members = [
    "chimes-store-utils",
    "chimes-dbs-factory",
    "chimes-store-core",
    "chimes-store-dbs",
    "store-plugin-weixin",
    "store-plugin-rhai",
    "store-plugin-python",
    "store-plugin-compose",
    "store-plugin-restapi",
    "store-plugin-mqtt",
    "store-plugin-kafka",
    "store-plugin-es",
    "store-plugin-synctask",
    "extractors/*",
    "chimes-store-server",
    "chimes-starter",
    "chimescoresec"
]

[workspace.package]
authors = ["Long Zou <longzou@hotmail.com>"]
edition = "2021"
version = "1.1.7"
readme = "README.md"
license = "MIT OR Apache-2.0"
categories = ["store"]
description = "GrowthStore是一个基于Rust体系的成长型的企业级后台服务的开发框架。它提供了“约定大于配置，配置即服务”的开发理念，采用统一的约定、灵活的配置来实现绝大多数的业务，通过灵活高效的扩展体系，来满足各种特殊化的业务需求，快速应对企业的业务成长需要。它采用InvokeURI作为统一的服务资源标识，使得它的各种功能可以使用一套统一化的URI来进行表示，而前端只需要根据这些URI的规范即可知道GrowthStore的具体提供服务。"
keywords = ["Chimes", "Store", "SQL", "Server"]
repository = "https://gitee.com/longzou/chimes-store"
rust-version = "1.86"


[patch.crates-io]
chimes-dbs-factory = { path = "chimes-dbs-factory" }
chimes-store-utils = { path = "chimes-store-utils" }
chimes-store-core = { path = "chimes-store-core" }
chimes-store-dbs = { path = "chimes-store-dbs" }
store-plugin-weixin = { path = "store-plugin-weixin" }
store-plugin-compose = { path = "store-plugin-compose" }
store-plugin-restapi = { path = "store-plugin-restapi" }
store-plugin-rhai = { path = "store-plugin-rhai" }
store-plugin-python = { path = "store-plugin-python" }  
store-plugin-kafka = { path = "store-plugin-kafka" }
store-plugin-mqtt = { path = "store-plugin-mqtt" }
store-plugin-es = { path = "store-plugin-es" }
store-plugin-synctask = { path = "store-plugin-synctask" }
chimescoresec = { path = "chimescoresec" }

[workspace.dependencies]
chimes-dbs-factory = "*"
chimes-store-utils = "*"
chimes-store-core = "*"
chimes-store-dbs = "*"
store-plugin-voice = "*"
growth-image-proc = "*"
lazy_static = "1.4.0"
log = "0.4"
simple_logger = { version = "4.2", features = ["stderr"] }
fastrace = { version = "0.7", features = ["enable"] }
fastrace-tracing = "0.1"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rbs = { version = "4.5" }
rbatis = {version = "4.5"}
anyhow = "1"
async-task = "4.7"
fastdate = { version = "0.3" }
substring = "1.4"
digest = "0.10"
rsa = "0.9"
base16ct = { version = "0.3", features = ["alloc"]}
base64 = "0.22"
base32 = "0.5"
rand = "*"
sha2 = "0.10"
sha1 = "0.10"
md5 = "0.8"
jsonpath-rust = "0.6"
jsonwebtoken = "10"
num_cpus = "1.16"
itertools = "0.12"
indexmap = "*"
rust-crypto = "0.2.36"
serde-xml-rs = "0.8"
toml = "*"
r2d2 = "0.8"
csv = "1.4"
calamine = "0.31"
tokio-stream = "*"
tokio-util = { version = "0.7", features = ["full"] }
once_cell = "1.16.0"
urlencoding = "2.1.0"
clap = { version = "4.3", features = ["derive"] }
derivative = "2.2.0"
## async-std = "1.7.0"
regex = "1.11.0"
url = "2.5.0"
siumai = "0.10"
ordered-float = "5"
encoding_rs = "0.8"
pyo3 = { version="0.27", features = ["auto-initialize"]}
reqwest = { version ="0.12", features = ["json", "stream"] }
chrono = "0.4"
futures = "0.3"
futures-lite = "2"
futures-core = "0.3"
futures-util = "0.3"
eventsource-stream = "0.2.3"
futures-timer = "3.0"
reqwest-eventsource = "0.6"
tokio-cron-scheduler = "*"
serde_yaml_ok = "0.9"
rayon = { version="*" }
## tera feature humansize is occurred to broken link in linux, so we remove the humansize feature 
tera = { version = "1", default-features = false, features = ["urlencode", "slug", "chrono", "chrono-tz", "rand", "builtins"] }
rbdc = { version = "4.5" }
redis = { version = "0.32", features = ["tokio-comp", "cluster", "cluster-async", "r2d2"] }
uuid = "1.15.1"
clap-cargo = { version = "0.15.0" }
flume = "0.11.0"
arrow-array = "57"
jsonschema = "0.33.0"
async-trait = "*"
image = "0.25.5"
nalgebra = "0.33.2"
rmcp = { version = "0.6.0", default-features = false }
libloading = "*"
sm3 = "*"
hmac-sm3 = "*"
notify = "8.0.0"
notify-debouncer-full = "0.5.0"
ndarray = "0.16.1"
ndarray-stats = "0.4"
arcstr = "1.2.0"


[workspace.dependencies.salvo]
default-features = true
features = [
    "affix-state",
    "acme",
    "cors",
    "logging",
    "oapi",
    "quinn",
    "serve-static",
    "sse",
    "jwt-auth",
    "websocket",
]
version = "0.84"

[profile.release]
opt-level = 3
lto = false
strip = true

